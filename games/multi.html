/* ============ M1. VIER GEWINNT ============ */
function connect4(){
  var N=NET(),S={b:[],turn:0,win:-1,line:null},hv=3,bt=0,CO=['#ff4d5e','#ffd23b'];
  function rowOf(c){for(var r=5;r>=0;r--)if(S.b[r][c]<0)return r;return -1}

  function run(r,c,p){
    var best=1,line=[[r,c]];
    [[0,1],[1,0],[1,1],[1,-1]].forEach(function(d){
      var l=[[r,c]];
      for(var s=-1;s<=1;s+=2){var rr=r+d[0]*s,cc=c+d[1]*s;while(rr>=0&&rr<6&&cc>=0&&cc<7&&S.b[rr][cc]===p){l.push([rr,cc]);rr+=d[0]*s;cc+=d[1]*s}}
      if(l.length>best){best=l.length;line=l}
    });

  }

  function put(c,p){
    if(S.win>=0||S.turn!==p)return;

    if(q[0]>=4){S.win=p;S.line=q[1]}else if(S.b[0].every(function(v){return v>=0}))S.win=2;else S.turn=1-p;
    bt=0;sync();

  function bot(p){
    var best=3,sc=-1e9;

      var r=rowOf(c);if(r<0)continue;var v=3-Math.abs(c-3)+R()*.4;
      S.b[r][c]=p;if(run(r,c,p)[0]>=4)v+=100;
      S.b[r][c]=1-p;if(run(r,c,1-p)[0]>=4)v+=50;
      S.b[r][c]=p;if(r>0){S.b[r-1][c]=1-p;if(run(r-1,c,1-p)[0]>=4)v-=40;S.b[r-1][c]=-1}
      S.b[r][c]=-1;

  }

    if(m.t=='drop')put(m.c,from);
    if(m.t=='again'&&S.win>=0){reset();sync()}
  });
  N.onClient(function(m){if(m.t=='st')S=m.S});
  function drop(c){if(S.win>=0)return;if(N.host)put(c,N.me);else N.toHost({t:'drop',c:c})}

  function lay(){var cs=Math.min((W-20)/7,(H-150)/6.6);return{cs:cs,x:(W-7*cs)/2,y:Math.max(100,(H-6*cs)/2+24)}}
  return{
    kd:function(k){
      if(k=='ArrowLeft'||k=='KeyA')hv=Math.max(0,hv-1);
      if(k=='ArrowRight'||k=='KeyD')hv=Math.min(6,hv+1);
      if(k=='Space'||k=='Enter'||k=='ArrowDown'||k=='KeyS'){if(S.win>=0)again();else if(S.turn===N.me)drop(hv)}
      if(/^Digit[1-7]$/.test(k)&&S.turn===N.me)drop(+k.slice(5)-1);
    },
    pd:function(x,y){
      if(S.win>=0){again();return}
      var L=lay(),c=Math.floor((x-L.x)/L.cs);
      if(c>=0&&c<7){hv=c;if(S.turn===N.me)drop(c)}
    },
    u:function(dt){

      if(N.host&&S.win<0&&N.players[S.turn]&&N.players[S.turn].bot){bt+=dt;if(bt>.8)put(bot(S.turn),S.turn)}
    },
    d:function(){
      var L=lay(),cs=L.cs;
      bg('#0c1030','#1c2260');
      var txt,col='#fff';
      if(S.win>=0){txt=S.win==2?'Unentschieden':(S.win===N.me?'Du gewinnst! 🎉':N.players[S.win].name+' gewinnt');col=S.win==2?'#fff':CO[S.win]}

/* ============ M2. TRON-ARENA ============ */
function tron(){
  var N=NET(),GW=64,GH=40,np=N.players.length,Pl=[],grid=new Uint8Array(GW*GH),tm=0,over=0,win=-1,cd=3,lcd=3,sx=0,sy=0;
  var COL=['#ff4d5e','#4dc3ff','#ffd23b','#6fe08a'],SP=[[6,13,0],[GW-7,26,2],[20,5,1],[43,GH-6,3]],DX=[1,0,-1,0],DY=[0,1,0,-1],STEP=.085;
  function heads(){return Pl.map(function(p){return[p.x,p.y,p.d,p.a]})}
  function reset(){
    grid.fill(0);Pl=[];
    for(var i=0;i<np;i++){var s=SP[i];Pl.push({x:s[0],y:s[1],d:s[2],nd:s[2],a:1});grid[s[1]*GW+s[0]]=i+1}
    over=0;win=-1;cd=3;lcd=3;tm=0;
  }
  function loadNew(m){reset();m.h.forEach(function(h,i){if(Pl[i]){Pl[i].x=h[0];Pl[i].y=h[1];Pl[i].d=h[2];Pl[i].a=h[3];Pl[i].nd=h[2]}});cd=m.cd}
  reset();

  function botDir(p){
    var opts=[p.d,(p.d+3)%4,(p.d+1)%4],sc=opts.map(function(d){var n=0,x=p.x,y=p.y;while(n<12){x+=DX[d];y+=DY[d];if(!free(x,y))break;n++}return n+(d==p.d?1.5:0)+R()*.8}),b=0;
    for(var i=1;i<3;i++)if(sc[i]>sc[b])b=i;

  function step(){
    var nc=[],mv=[];
    Pl.forEach(function(p,i){if(!p.a)return;if(N.players[i].bot)p.nd=botDir(p);if(((p.nd+2)%4)!==p.d)p.d=p.nd;mv[i]=[p.x+DX[p.d],p.y+DY[p.d]]});
    Pl.forEach(function(p,i){
      if(!p.a)return;

      if(dead){p.a=0;shake(6)}else{p.x=m[0];p.y=m[1];nc.push([m[0],m[1],i+1])}

  }

    if(m.t=='dir'&&Pl[from])Pl[from].nd=m.d;

  });

    else if(m.t=='cd')cd=m.cd;
    else if(m.t=='st'){
      m.h.forEach(function(h,i){if(Pl[i]){Pl[i].x=h[0];Pl[i].y=h[1];Pl[i].d=h[2];Pl[i].a=h[3]}});
      m.c.forEach(function(c){grid[c[1]*GW+c[0]]=c[2]});over=m.o;win=m.w;cd=0;
    }
  });
  function turn(d){if(N.host){if(Pl[N.me])Pl[N.me].nd=d}else N.toHost({t:'dir',d:d})}
  function again(){if(!over)return;if(N.host){reset();N.toAll({t:'new',h:heads(),cd:3})}else N.toHost({t:'again'})}

    kd:function(k){
      var m={ArrowRight:0,KeyD:0,ArrowDown:1,KeyS:1,ArrowLeft:2,KeyA:2,ArrowUp:3,KeyW:3};
      if(k in m)turn(m[k]);else if(k=='Space'||k=='Enter')again();
    },
    pd:function(x,y){sx=x;sy=y;if(over)again()},
    pu:function(x,y){var dx=x-sx,dy=y-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>24)turn(Math.abs(dx)>Math.abs(dy)?(dx>0?0:2):(dy>0?1:3))},

      for(var y=0;y<GH;y++)for(var x=0;x<GW;x++){var v=grid[y*GW+x];if(v){g.fillStyle=COL[v-1];g.globalAlpha=.78;g.fillRect(ox+x*cs,oy+y*cs,cs+.5,cs+.5)}}
      g.globalAlpha=1;
      Pl.forEach(function(p,i){if(p.a){g.fillStyle='#fff';g.shadowColor=COL[i];g.shadowBlur=12;g.fillRect(ox+p.x*cs-1,oy+p.y*cs-1,cs+2,cs+2);g.shadowBlur=0}});

/* ============ M3. AIR-HOCKEY ============ */

    var tx=best?best.x:0,tz=best?best.z:0,dd=Math.hypot(p.x,p.z);

      var a=Pl[i],b=Pl[j];if(!a.a||!b.a)continue;
      var dx=b.x-a.x,dz=b.z-a.z,d=Math.hypot(dx,dz);

    kd:function(k){if(k=='Space'||k=='Enter'){if(over)again();else dashReq=1}},

    d:function(){

/* ============ M5. REAKTIONS-DUELL ============ */
function react(){
  var N=NET(),np=N.players.length,RMAX=5,S={ph:'wait',rd:1,sc:[],res:[],o:0},goT=0,wt=0,rt=[],ans=0,shown=0,rtm=0;
  function resetAll(){S.rd=1;S.sc=N.players.map(function(){return 0});S.o=0;newRound()}
  function newRound(){
    S.ph='wait';S.res=N.players.map(function(){return{ms:null,e:0}});wt=1.8+R()*3.2;ans=0;
    rt=N.players.map(function(){return 260+R()*260});sync();
  }
  function sync(){N.toAll({t:'st',S:S})}
  function done(){
    var ok=S.res.map(function(r,i){return{i:i,ms:r.ms}}).filter(function(o){return o.ms!=null}).sort(function(a,b){return a.ms-b.ms}),pts=[3,2,1];
    ok.forEach(function(o,k){S.sc[o.i]+=pts[k]||0});

  }

    var all=S.res.every(function(r,i){return r.ms!=null||r.e||(N.players[i].bot&&false)});
    var el=performance.now()-goT;

    },

      else if(ph=='go'){T(ans?'✔':'JETZT!',W/2,H/2+fs*.3,fs*1.4,'#fff')}
      else{
        T(ph=='over'?'Endstand':'Runde '+S.rd+' / '+RMAX,W/2,60,Math.min(34,W/14),'#fff');
        var order=N.players.map(function(p,i){return i}).sort(function(a,b){return ph=='over'?S.sc[b]-S.sc[a]:(S.res[a].ms==null?9e9:S.res[a].ms)-(S.res[b].ms==null?9e9:S.res[b].ms)});
        order.forEach(function(i,k){
          var y=110+k*Math.min(52,(H-200)/np),nm=(i===N.me?'Du: ':'')+N.players[i].name,txt=ph=='over'?S.sc[i]+' Punkte':(S.res[i].e?'zu früh':(S.res[i].ms==null?'–':S.res[i].ms+' ms'))+'   ('+S.sc[i]+' Pkt)';
          T(nm,W/2-20,y,Math.min(24,W/18),i===N.me?'#ffe14d':'#fff','right');T(txt,W/2+20,y,Math.min(24,W/18),'#cde','left');
        });
        if(ph=='over')T('Tippen oder Leertaste = nochmal',W/2,H-40,18,'#cde');
      }
      if(ph=='wait'||ph=='go')T('Runde '+S.rd+' / '+RMAX+' · Punkte: '+S.sc.map(function(s,i){return(i===N.me?'Du':N.players[i].name)+' '+s}).join(' · '),W/2,H-14,Math.min(14,W/28),'rgba(255,255,255,.85)');
    },
    dbg:function(){return JSON.stringify(S)}
